---
# 1. The Service Account (IRSA Link)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.app.name }}-sa
  namespace: {{ .Values.app.team_namespace }}
  annotations:
    # Dynamically links to the IAM Role generated by Terragrunt for THIS specific team!
    eks.amazonaws.com/role-arn: "arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/eks-secrets-role-{{ .Values.app.team_namespace }}"
---
# 2. The Secret Store (Authorizes via the Service Account)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.app.name }}-aws-store
  namespace: {{ .Values.app.team_namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.app.name }}-sa
---
# 3. The External Secret (Fetches data and creates a native K8s Secret)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.app.name }}-aws-secrets
  namespace: {{ .Values.app.team_namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.app.name }}-aws-store
    kind: SecretStore
  target:
    name: {{ .Values.app.name }}-aws-secrets # This matches the secretRef in deployment.yaml
    creationPolicy: Owner
  dataFrom:
    # Dynamically targets the exact AWS path: e.g., /dev/team-alpha/phone-store-api/
    - find:
        path: "/{{ .Values.app.environment }}/{{ .Values.app.team_namespace }}/{{ .Values.app.name }}/"